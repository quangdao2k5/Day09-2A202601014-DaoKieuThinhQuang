[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-dispute-agents"
version = "1.0.0"
description = "Deterministic multi-agent Olist dispute resolution pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
olist-disputes = "ecommerce_agents.cli:main"

[tool.setuptools.packages.find]
include = ["ecommerce_agents*"]
